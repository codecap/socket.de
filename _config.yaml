# Welcome to Socket!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "socket.de | OpenStack & Private Cloud"
email: ping📯socket.de
seo_description:
  en: "socket.de: Your expert for robust Private Cloud solutions, managed OpenStack, and secure hybrid IT infrastructure."
  de: "socket.de: Ihr Experte für robuste Private Cloud-Lösungen, managed OpenStack und sichere hybride IT-Infrastruktur."
seo_keywords:
  en: "openstack, private cloud, cloud, managed services, linux, it infrastructure"
  de: "openstack, private cloud, cloud, managed services, linux, it infrastruktur"
baseurl: ""
default_language: "en"
url: https://socket.de
twitter_username:
github_username: codecap
#theme: socket
permalink: /:code.html
# Value to use in menu per language
menu:
  services:
    en: "Services"
    de: "Services"
  about:
    en: "About"
    de: "Wir"
  imprint:
    en: "Imprint"
    de: "Impressum"
  vna:
    en: "Profile"
    de: "Profile"
  offer:
    en: "Own Private Cloud"
    de: "Eigene Cloud"
  privatepolicy:
    en: "Private Policy"
    de: "Datenschutzerklärung"

# Path to the translated page
t:
  index:
    en: "/en/"
    de: "/de/"
  services:
    en: "/en/services"
    de: "/de/services"
  about:
    en: "/en/about"
    de: "/de/about"
  imprint:
    en: "/en/imprint"
    de: "/de/imprint"
  vna:
    en: "/en/vna"
    de: "/de/vna"
  clients:
    en: "/en/clients"
    de: "/de/clients"
  offer:
    en: "/en/offer"
    de: "/de/offer"
  privatepolicy:
    en: "/en/privatepolicy"
    de: "/de/privatepolicy"

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from

include:
  - "en"
  - "de"

sitemap:
  exclude:
    - "/403.html"
    - "/404.html"
    - "/500.html"
    - "/503.html"
    - "/de/403.html"
    - "/de/404.html"
    - "/de/500.html"
    - "/de/503.html"
    - "/en/403.html"
    - "/en/404.html"
    - "/en/500.html"
    - "/en/503.html"
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - Gemfile
  - node_modules
  - package.json
  - package-lock.json
  - gulpfile.js
  - npm-shrinkwrap.json
  - socket.gemspec
  - README.md
  - LICENSE.txt
