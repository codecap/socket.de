---
main_title: 'Was wir anbieten'
main_content: |
  Konkrete Leistungen. Klare Ergebnisse. Festpreis nach dem ersten Gespräch.
block_title: "Leistungsportfolio"
content:
  - title: 'Technologie-Evaluierung'
    content: |
      Du hast ein Problem. Die richtige Technologie ist unklar.<br/>
      <br/>
      Private Cloud, Migration, Architekturentscheidung - du brauchst eine
      Empfehlung die du umsetzen kannst, keine Liste von Optionen. Du
      bekommst eine schriftliche Einschätzung: was zu deinem Kontext passt,
      warum, und wie der nächste Schritt aussieht.<br/>
      <br/>
      **Erster Schritt:** ein 60-minütiges Gespräch. Keine Vorbereitung nötig.
  - title: 'Consulting'
    content: |
      Du kennst die Richtung. Die Technologie ist komplex und die
      Entscheidungen haben Gewicht.<br/>
      <br/>
      OpenStack, Ceph, Private-Cloud-Infrastruktur - wir arbeiten neben deinem
      Team, beantworten die schwierigen Fragen und halten die Architektur
      ehrlich. Du konzentrierst dich auf dein Geschäft.<br/>
      <br/>
      **Erster Schritt:** beschreibe wo du stehst und was dich blockiert.
  - title: 'Architektur & Umsetzung'
    content: |
      Du weißt was du willst. Du brauchst jemanden der es richtig baut.<br/>
      <br/>
      Architektur und Umsetzung gehören zusammen - wir steigen nicht nach
      einem fremden Plan ein. Du bekommst eine funktionierende Umgebung,
      dokumentiert, übergeben so dass dein Team sie betreiben kann.
      Keine Black Box, keine Abhängigkeit.<br/>
      <br/>
      **Erster Schritt:** beschreibe dein Setup in wenigen Sätzen.
  - title: 'Training'
    content: |
      Dein Team braucht Wissen für den Betrieb.<br/>
      <br/>
      Praxisnahe Schulungen - aufgebaut auf echten Umgebungen.<br/>
      <br/>
      → [socket.de/training](https://socket.de/training)
