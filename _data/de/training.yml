---
- title: 'OpenStack & Ceph Training'
  content: >-
    Praxisnahe Workshops. Echte Lab-Umgebung. Keine Black Box.
- title: '🎯 Kurse'
  content: |
    | Kurs | Dauer | Status |
    |---|---|---|
    | OpenStack mit Ceph | 5 Tage | Verfügbar |
    | OpenStack | 5 Tage | Verfügbar |
    | Ceph | 3 Tage | Verfügbar |
    | OpenStack COA Prüfungsvorbereitung | 5 Tage | In Vorbereitung |
    | Individueller Inhalt | nach Absprache | Auf Anfrage |
- title: "🛠️ Ablauf"
  content: |
    Jeder Workshop läuft in einer dedizierten Lab-Umgebung.<br/>
    Kein Aufwand — die komplette Lab-Umgebung wird mitgebracht.<br/>
    Kursunterlagen sind öffentlich einsehbar unter [infraguide.org](https://infraguide.org).<br/>
- title: '👥 Für wen'
  content: |
    - Linux-Administratoren die in die Cloud-Infrastruktur einsteigen
    - Erfahrene Cloud-Nutzer die ihr OpenStack- oder Ceph-Wissen vertiefen möchten
    - Cloud-Architekten die Private-Cloud-Umgebungen evaluieren oder gestalten
    - Teams die eine neue Plattform einführen
- title: '📅 Format & Verfügbarkeit'
  content: |
    - Remote und Vor-Ort (DACH)
    - 🇩🇪 Deutsch und 🇬🇧 Englisch
    - 3- und 5-tägige Formate (9:00 - 17:00)
    - Halbtagesformat möglich (9:00 - 13:00), 6 und 10 Einheiten
- title: '👨‍💻 Über den Trainer'
  content: |
    Über 10 Jahre praktische Erfahrung im Bereich Private Cloud und Open Source
    Infrastruktur. OpenStack seit 2019, Ceph seit 2022. In den meisten
    Projekten der entscheidende Faktor dafür, dass neue Technologien sicher
    in den Produktivbetrieb überführt wurden.

    <br/>
    <br/>
    Kein Nachschlagewerk - die Methodik, die komplexe Umgebungen
    beherrschbar macht.
    <br/>
    <br/>
    **Zertifizierungen:**<br/>
    - Red Hat Certified Specialist in Ceph Cloud Storage<br/>
    - Certified OpenStack Administrator<br/>
    - Certified Kubernetes Administrator<br/>
    - Red Hat Certified Specialist in Ansible Automation<br/>
    - Prometheus Certified Associate<br/>
    - Red Hat Certified System Administrator<br/>
    <br/>
    Kursinhalte können auf den Kenntnisstand, den Tech-Stack und die Ziele
    Ihres Teams angepasst werden. Einfach melden.
