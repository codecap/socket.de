stitle:
  section_title: 'Services'
  show_in_feed: true
  link: '/services/'
sdata:
  - title: 'Private Cloud Solution'
    image: 'service1.svg'
    content: |
      OpenStack and Ceph as the foundation - a private cloud that scales,
      runs stable, and fits your infrastructure.<br/>
      <br/>
      What runs on top:
      * Kubernetes / OpenShift / OKD
      * Infrastructure as Code and GitOps
      * Ansible / Terraform
      * VMs and existing workloads
      * Bare-Metal workloads
      * Block, File, and Object Storage
      * Database as a Service
  - title: 'Design and Architecture'
    image: 'service2.svg'
    content: |
      Architecture that fits your infrastructure ... not the other way around.<br/>
      <br/>
      Scaling, high availability, networking, storage - designed for your
      requirements, not a template. The cloud runs stable and evolves as
      requirements change.
  - title: 'Build and Operations'
    image: 'service3.svg'
    content: |
      The architecture is set ... now it gets built. The platform is set up,
      configured, and put into operation.<br/>
      <br/>
      Before handover: tested until it runs stable, documented so your team
      knows what was built and why. After that the platform is not left alone -
      ongoing operations and support are part of the engagement.
  - title: 'Consulting'
    image: 'service4.svg'
    content: |
      Not everyone comes with a clear requirement ... sometimes the problem
      is there, but the path is not.<br/>
      <br/>
      Listen, understand, create clarity. Show paths that fit the context -
      not the nearest solution. And stay alongside until the direction is set.
  - title: 'Workshops'
    image: 'service5.svg'
    content: |
      A clear picture in your head through real experience.<br/>
      <br/>
      Participants work directly in the environment, run into real problems,
      solve them themselves. Understanding comes from experience - not from
      explanations.<br/>
      <br/>
      After the workshop you can repeat it in your own lab.
      That is the goal.<br/>
      <br/>
      → [All trainings and courses](https://socket.de/en/training)
