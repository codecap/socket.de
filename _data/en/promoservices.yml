stitle:
  section_title: 'Services'
sdata:
  - title: 'Conception and Implementation of Individual Cloud Architecture'
    image: 'service1.svg'
    content: >-
      We help you build a **flexible and scalable cloud based on OpenStack and Ceph** for your projects.
      This enables you to use modern DevOps techniques and tools in your home network to develop and operate your software, including:
      * Infrastructure as Code and GitOps
      * Kubernetes / OpenShift / OKD
      * Ansible / Terraform / Chef
      * Rancher
      * Database as a Service

      Your cloud is delivered **end-to-end from a single source**. As a reliable point of contact, we of course remain available to support you even after completion.
  - title: 'Design and Architecture'
    image: 'service2.svg'
    content: >-
      Your cloud must function stably from the very first minute.
      It should grow with your company in the long term and adapt
      effortlessly to new requirements. socket lays the foundation
      for a secure, scalable cloud architecture. This naturally
      runs on the latest technology.
  - title: 'Setup and Operation'
    image: 'service3.svg'
    content: >-
      Open Source, specialized software, and various providers: When
      searching for the right soft- and hardware, do you have the agony
      of choice rather than the choice itself? We have been working
      with all common systems for many years. That's why we can
      honestly tell you which solution optimally suits your requirements
      – and which does not. For "I forgot something" questions, we are
      only a phone call away at any time.
  - title: 'Consulting'
    image: 'service4.svg'
    content: >-
      You simply don't have time to deal with "OpenStack" and "Ceph"?
      We understand that – after all, you want to be able to fully
      concentrate on your company. In the meantime, we've got your back
      when it comes to cloud architecture. Our team advises you on
      suitable solutions. We discuss exactly the things that matter.
      No more and no less. In this way, we jointly develop high-quality
      and fluid concepts that can do what they are supposed to do.
  - title: 'Workshops'
    image: 'service5.svg'
    content: >-
      Do you want to look behind the scenes of your cloud solution yourself?
      We are happy to hear that! Our qualified employees put together
      individual workshops upon request, in which we discuss all the topics
      you want to learn more about. Theoretical concepts and explanations
      are followed by a practical part where you can experiment directly
      with what you have learned.
