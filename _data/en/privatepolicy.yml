    The following personal data may be processed:
    <ul>
        <li>IP address and location data</li>
        <li>Device data such as operating system, browser, and device type</li>
        <li>Click and interaction data, e.g., which ads were clicked</li>
        <li>Demographic data and interests, provided the user is logged into Google</li>
        <li>Cookies and remarketing IDs to create target audiences for personalized ads</li>
    </ul>

    For more information on the cookies set by Google Ads and how to disable
    them, please refer to the official documentation: <a href="https://business.safety.google/adscookies">
