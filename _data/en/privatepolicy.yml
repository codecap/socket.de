- title: "GitHub Pages"
  content: |
    GitHub Pages

    The websites are hosted via <a href="https://pages.github.com">GitHub Pages</a>
    (GitHub, Inc., 88 Colin P Kelly Jr St, San Francisco, CA 94107, USA).
    When accessing the pages, GitHub processes technically required data,
    such as
    <ul>
      <li>IP address</li>
      <li>date/time</li>
      <li>requested URL</li>
      <li>referrer</li>
      <li>user agent</li>
      <li>HTTP status</li>
    </ul>
    to ensure content delivery and secure operation. We have no influence
    over this processing. For more information, please refer to the
    <a href="https://docs.github.com/en/site-policy/privacy-policies/github-privacy-statement">GitHub Privacy Policy</a>.

- title: "Google Analytics"
  content: |
    This website uses Google Analytics, a web analytics service by Google LLC,
    to analyze and improve the usage of the website. Google Analytics
    processes personal data such as:
    <ul>
      <li>IP address (anonymized, e.g., through IP masking)</li>
      <li>Device and browser information (operating system, browser, device type)</li>
      <li>Usage data (visited pages, duration of visit, clicks)</li>
      <li>Location data (only rough, e.g., city or region)</li>
    </ul>

    The data is used to evaluate user behavior on the website, create
    statistics, and optimize the website. For more information on the data
    processed by Google Analytics and how users can disable data collection,
    please refer to the official documentation: <a href="https://support.google.com/analytics/answer/6004245?hl=en">
    Google Analytics – Data and Security Information</a>.

- title: "Google Ads"
  content: |
    This website uses Google Ads, an online advertising service by Google LLC.
    Google Ads uses cookies to measure ad performance, improve the
