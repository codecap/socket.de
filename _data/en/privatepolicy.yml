- title: "Preamble"
  content: |
    With the following privacy policy, we would like to inform you about which types of your personal data (hereinafter also referred to briefly as "data") we process, for which purposes, and to what extent. The privacy policy applies to all processing of personal data carried out by us, both in the course of providing our services and, in particular, on our websites, in mobile applications, as well as within external online presences, such as, for example, our social media profiles (hereinafter collectively referred to as the "online offering").

    The terms used are not gender-specific.

    Status: January 16, 2026

    #### Controller
    Vladislav, Nazarenko / socket GmbH  
    Mergenthalerallee 73-75  
    65760 Eschborn

    Email address: [datenschutz@socket.de](mailto:datenschutz@socket.de)  
    Legal notice: [https://socket.de/en/imprint](https://socket.de/en/imprint)

- title:  "Overview of Processing Activities"
  content: |  
    The following overview summarizes the types of processed data and the purposes of their processing and refers to the data subjects concerned.

    #### Types of processed data
    * Location data.
    * Contact data.
    * Content data.
    * Usage data.
    * Meta, communication, and procedural data.
    * Log data.

    #### Categories of data subjects
    * Communication partners.
    * Users.

    #### Purposes of processing
    * Communication.
    * Security measures.
    * Reach measurement.
    * Tracking.
    * Conversion measurement.
    * Audience building.
    * Organizational and administrative procedures.
    * Feedback.
    * Marketing.
    * Profiles with user-related information.
    * Provision of our online offering and user-friendliness.
    * Information technology infrastructure.

- title: "Relevant Legal Bases"   
  content: |
    **Relevant legal bases under the GDPR:** Below you will find an overview of the legal bases of the GDPR on the basis of which we process personal data. Please note that, in addition to the provisions of the GDPR, national data protection regulations may apply in your or our country of residence or establishment. Should more specific legal bases be applicable in individual cases, we will inform you of these in the privacy policy.

    * **Consent (Art. 6 para. 1 sentence 1 lit. a GDPR):** The data subject has given their consent to the processing of personal data relating to them for a specific purpose or several specific purposes.
    * **Performance of a contract and pre-contractual inquiries (Art. 6 para. 1 sentence 1 lit. b GDPR):** Processing is necessary for the performance of a contract to which the data subject is a party or for the implementation of pre-contractual measures taken at the request of the data subject.
    * **Legitimate interests (Art. 6 para. 1 sentence 1 lit. f GDPR):** Processing is necessary to safeguard the legitimate interests of the controller or a third party, provided that the interests, fundamental rights, and freedoms of the data subject requiring protection of personal data do not outweigh those interests.

    **National data protection regulations in Germany:** In addition to the data protection regulations of the GDPR, national data protection regulations apply in Germany. This includes, in particular, the Act on Protection against Misuse of Personal Data in Data Processing (Federal Data Protection Act – BDSG).

- title: "Security Measures"
  content: |
    In accordance with the statutory requirements, taking into account the state of the art, we implement suitable technical and organizational measures to ensure a level of protection appropriate to the risk.

    The measures include, in particular, ensuring the confidentiality, integrity, and availability of data by controlling physical and electronic access to the data as well as access relating to them.

    **Securing online connections using TLS/SSL encryption technology (HTTPS):** In order to protect user data transmitted via our online services from unauthorized access, we use TLS/SSL encryption technology.

- title: "Provision of the Online Offering and Web Hosting"
  content: |
    We process user data in order to be able to provide our online services to them.

    * **Types of processed data:** Usage data (e.g., page views); meta, communication, and procedural data (e.g., IP addresses); log data.
    * **Data subjects:** Users (e.g., website visitors).
    * **Purposes of processing:** Provision of our online offering; information technology infrastructure.
    * **Legal bases:** Legitimate interests (Art. 6 para. 1 sentence 1 lit. f GDPR).

    **Further notes on processing processes, procedures, and services:**

    * **Provision of the online offering on rented storage space:** To provide our online offering, we use rented disk space. **Legal bases:** Legitimate interests (Art. 6 para. 1 sentence 1 lit. f GDPR).
    * **Collection of access data and log files:** Access to our online offering is logged in the form of "server log files." **Deletion of data:** Log file information is stored for a maximum of 30 days.
    * **GitHub Pages:** Provision is carried out via [GitHub Pages](https://pages.github.com). Further information: [GitHub Privacy Policy](https://docs.github.com/en/site-policy/privacy-policies/github-privacy-statement).

- title: "Use of Cookies"
  content: |
    The term “cookies” refers to functions that store information on users’ end devices and read it from them.

    **Storage duration:**
    * **Temporary cookies:** Are deleted after leaving the website.
    * **Permanent cookies:** Remain stored, storage duration **up to two years**.
    * **Types of processed data:** Meta, communication, and procedural data.
    * **Legal bases:** Legitimate interests (Art. 6 para. 1 sentence 1 lit. f GDPR); consent (Art. 6 para. 1 sentence 1 lit. a GDPR).

    **Further notes:**
    * **Processing based on consent:** We use a consent management solution.

- title: "Contact and Inquiry Management"
  content: |
    When contacting us, the information provided by the inquiring persons is processed.

    * **Types of processed data:** Contact data; content data; meta and communication data.
    * **Data subjects:** Communication partners.
    * **Purposes of processing:** Communication; organizational and administrative procedures.
    * **Legal bases:** Legitimate interests (Art. 6 para. 1 sentence 1 lit. f GDPR); performance of a contract (Art. 6 para. 1 sentence 1 lit. b GDPR).

    **Further notes:**
    * **Contact form:** We use this data exclusively for communication. 
    * **Legal bases:** Performance of a contract (Art. 6 para. 1 sentence 1 lit. b GDPR).

- title: "Web Analytics, Monitoring, and Optimization"
  content: |
    Web analytics (also referred to as “reach measurement”) serves to evaluate visitor flows of our online offering and may include behavior, interests, or demographic information of visitors, such as age or gender, as pseudonymous values. With the help of reach analysis, we can, for example, determine at which times our online offering or its functions or content are most frequently used or invite reuse.

    In addition to web analytics, we may also use testing procedures to test and optimize different versions of our online offering or its components.

    Furthermore, users’ IP addresses are stored. However, we use an IP masking procedure (i.e., pseudonymization by truncating the IP address) to protect users.

    **Notes on legal bases:** If we ask users for their consent to use third-party providers, the legal basis for data processing is consent. Otherwise, user data is processed on the basis of our legitimate interests.

    * **Types of processed data:** Usage data (e.g., page views and dwell time, click paths, usage intensity and frequency, device types and operating systems used, interactions with content and functions); meta, communication, and procedural data (e.g., IP addresses, timestamps, identification numbers, involved persons).
    * **Data subjects:** Users (e.g., website visitors, users of online services).
    * **Purposes of processing:** Reach measurement (e.g., access statistics, recognition of returning visitors); profiles with user-related information (creation of user profiles); provision of our online offering and user-friendliness.
    * **Storage and deletion:** Deletion according to the information in the section "General Information on Data Storage and Deletion". Storage of cookies for up to 2 years.
    * **Security measures:** IP masking (pseudonymization of the IP address).
    * **Legal bases:** Consent (Art. 6 para. 1 sentence 1 lit. a GDPR); legitimate interests (Art. 6 para. 1 sentence 1 lit. f GDPR).

    **Further notes on processing processes, procedures, and services:**

    * **Google Analytics:** We use Google Analytics to measure and analyze the use of our online offering on the basis of a pseudonymous user identification number. **Service provider:** Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Ireland; **Legal bases:** Consent (Art. 6 para. 1 sentence 1 lit. a GDPR); **Website:** [https://marketingplatform.google.com/intl/de/about/analytics/](https://marketingplatform.google.com/intl/de/about/analytics/); **Security measures:** IP masking (pseudonymization of the IP address); **Privacy policy:** [https://policies.google.com/privacy](https://policies.google.com/privacy); **Data processing agreement:** [https://business.safety.google/adsprocessorterms/](https://business.safety.google/adsprocessorterms/); **Basis for third-country transfers:** Data Privacy Framework (DPF), Standard Contractual Clauses; **Objection option (Opt-Out):** [https://tools.google.com/dlpage/gaoptout?hl=de](https://tools.google.com/dlpage/gaoptout?hl=de).
    * **Google Tag Manager:** Enables us to centrally manage website tags via a user interface. **Service provider:** Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Ireland; **Legal bases:** Consent (Art. 6 para. 1 sentence 1 lit. a GDPR); **Website:** [https://marketingplatform.google.com](https://marketingplatform.google.com); **Privacy policy:** [https://policies.google.com/privacy](https://policies.google.com/privacy).

- title: "Online Marketing"
  content: |
    We process personal data for the purpose of online marketing, which includes, in particular, the marketing of advertising space or the display of advertising content.

    For these purposes, so-called user profiles are created and stored in cookies. In general, no clear data of users (such as email addresses or names) are stored as part of the online marketing process, but pseudonyms.

    **Notes on legal bases:** If we ask users for their consent, the legal basis is consent. Otherwise, processing is carried out on the basis of our legitimate interests.

    **Notes on withdrawal and objection (Opt-Out):**
    Users can disable cookies in their browser settings. We additionally recommend the following opt-out options:
    * **Europe:** [https://www.youronlinechoices.eu](https://www.youronlinechoices.eu)
    * **USA:** [https://optout.aboutads.info/](https://optout.aboutads.info/)
    * **Types of processed data:** Usage data (e.g., page views); meta, communication, and procedural data (e.g., IP addresses).
    * **Purposes of processing:** Reach measurement; tracking; audience building; marketing; conversion measurement.
    * **Legal bases:** Consent (Art. 6 para. 1 sentence 1 lit. a GDPR); legitimate interests (Art. 6 para. 1 sentence 1 lit. f GDPR).

    **Further notes on processing processes, procedures, and services:**

    * **Google Ads and conversion measurement:** Online marketing procedure for placing advertisements in Google's advertising network.
      **Service provider:** Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Ireland;
      **Legal bases:** Consent (Art. 6 para. 1 sentence 1 lit. a GDPR); legitimate interests (Art. 6 para. 1 sentence 1 lit. f GDPR);
      **Website:** [https://marketingplatform.google.com](https://marketingplatform.google.com);
      **Privacy policy:** [https://policies.google.com/privacy](https://policies.google.com/privacy);
      **Basis for third-country transfers:** Data Privacy Framework (DPF).
      **Further information:** Types of processing and processed data: [https://business.safety.google/adsservices/](https://business.safety.google/adsservices/). Data processing terms between controllers and Standard Contractual Clauses for third-country transfers: [https://business.safety.google/adscontrollerterms](https://business.safety.google/adscontrollerterms).

- title: "Plug-ins and Embedded Functions and Content"
  content: |
    We integrate functional and content elements into our online offering that are obtained from the servers of their respective providers (hereinafter referred to as “third-party providers”). These may include, for example, graphics, videos, or city maps.

    Integration always requires that the third-party providers of this content process users’ IP addresses, as they would otherwise not be able to send the content to users’ browsers.

    **Notes on legal bases:** If we ask users for their consent to use third-party providers, the legal basis is consent. Otherwise, user data is processed on the basis of our legitimate interests.

    * **Types of processed data:** Usage data (e.g., page views, dwell time); meta, communication, and procedural data (e.g., IP addresses); location data.
    * **Data subjects:** Users (e.g., website visitors, users of online services).
    * **Purposes of processing:** Provision of our online offering and user-friendliness.
    * **Storage and deletion:** Deletion according to the information in the section "General Information on Data Storage and Deletion".
    * **Legal bases:** Consent (Art. 6 para. 1 sentence 1 lit. a GDPR); legitimate interests (Art. 6 para. 1 sentence 1 lit. f GDPR).

    **Further notes on processing processes, procedures, and services:**

    * **Google Maps:** We integrate maps of the service "Google Maps" provided by Google. The processed data may include, in particular, users’ IP addresses and location data.
    * **Service provider:** Google Cloud EMEA Limited, 70 Sir John Rogerson’s Quay, Dublin 2, Ireland;
    * **Legal bases:** Consent (Art. 6 para. 1 sentence 1 lit. a GDPR);
    * **Website:** [https://mapsplatform.google.com/](https://mapsplatform.google.com/)
    * **Privacy policy:** [https://policies.google.com/privacy](https://policies.google.com/privacy)
    * **Basis for third-country transfers:** Data Privacy Framework (DPF).

- title: "Amendment and Update"
  content: |
    We ask you to regularly inform yourself about the content of our privacy policy. We adapt the privacy policy as soon as changes to the data processing carried out by us make this necessary.

    We will inform you as soon as the changes require your participation (e.g., consent) or other individual notification.

    If we provide addresses and contact information of companies and organizations in this privacy policy, please note that the addresses may change over time.  
