---
- main_title: These are the questions we often hear...
- title: 'What does socket do?'
  content: >-
    socket offers flexible solutions for your own cloud. We connect the
    cloud infrastructure to your network and storage systems or provide
    our own.

- title: 'Which technology does socket use?'
  content: >-
    We fundamentally rely on open-source options. However, we also work
    with proprietary solutions upon request.

- title: "Where are socket's cloud solutions located?"
  content: >-
    The server infrastructure can be set up on our premises or in your
    own data center.

- title: 'What happens after the server architecture is set up?'
  content: >-
    After the completion of every assignment, we hand over a well-
    structured documentation to you. This details all the prerequisites
    for successful operation. And lock-ins?
    They are guaranteed not to happen with us!