- title: "Hosting & Infrastructure"
  content: |
    The websites are hosted via [GitHub Pages](https://pages.github.com){:target="_blank" rel="noopener"} 
    (GitHub, Inc., 88 Colin P Kelly Jr St, San Francisco, CA 94107, USA).
    
    When accessing the pages, GitHub processes technically required data, such as:
    - IP address
    - Date and time of access
    - Requested URL
    - Referrer (previously visited page)
    - User agent (browser and operating system)
    - HTTP status code
    
    This ensures content delivery and secure operation. We have no influence over this processing. For more information, please refer to the [GitHub Privacy Statement](https://docs.github.com/en/site-policy/privacy-policies/github-privacy-statement){:target="_blank" rel="noopener"}.

- title: "Google Analytics 4"
  content: |
    This website uses Google Analytics 4 (GA4) by Google LLC. IP addresses are anonymized by default. The following data is processed:
    - Usage data (visited pages, clicks, scroll depth)
    - Device and browser information
    - Approximate location data
    
    You can prevent data collection by installing the [Google Analytics Opt-out Browser Add-on](https://tools.google.com/dlpage/gaoptout){:target="_blank" rel="noopener"}.

- title: "Google Ads"
  content: |
    We use Google Ads to display interest-based advertisements. This involves processing:
    - IP address and approximate location
    - Interaction data with ads
