<div class="wrapper">
	<header>
		<div class="container">
			<div class="header">
				<div class="logo">
					<a href="{{ site.baseurl }}/"><img src="{{ site.baseurl }}/assets/img/icons/logo_Socket.svg" alt="logo"></a>
				</div>
				<div class="header-right-side">
					{% include nav.html navclass='nav-top' %}
	
					<div class="header-contacts-desktop">
						<span class="header-divider"></span>
						{% for item in site.data.de.contact.cdata %}
						<a href="tel:{{ item.phone }}" class="header-phone">
							<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.27-2.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
							<span>{{ item.phone }}</span>
						</a>
						<a href="mailto:{{ item.email }}" class="btn-inquire-desktop">
							{% if page.url contains '/de/' %} Jetzt anfragen {% else %} Inquire Now {% endif %}
</a>
						</a>
						{% endfor %}
					</div>
				</div>
			</div>
		</div>
	</header>
