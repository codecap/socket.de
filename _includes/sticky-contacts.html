<div class="sticky-contacts-container">
    <button class="sticky-trigger" id="contactTrigger" aria-label="Toggle contact options">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span>{% if page.url contains '/de/' %} Kontakt {% else %} Contact {% endif %}</span>
    </button>
    {% for item in site.data.de.contact.cdata %}
    <div class="sticky-panel" id="contactPanel" itemscope itemtype="http://schema.org/Organization">
      <a href="tel:{{ item.phone }}" class="sticky-link phone" itemprop="telephone">
         <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.27-2.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
         {{ item.phone }}
      </a>
      <a href="mailto:{{ item.email }}" class="sticky-link email" itemprop="email">
         <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
         {% if page.url contains '/de/' %} E-Mail schreiben {% else %} Email Us {% endif %}
      </a>
    </div>
    {% endfor %}
  </div>
