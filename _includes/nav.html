{% assign current_lang = page.lang | default: site.default_language | default: 'en' %}
<nav class="{{ include.navclass }}">
    <ul class="menu mainNavList">
        <li><a href="{{ site.baseurl }}{{ site.t['services'][current_lang] }}"
                class="{% if page.url contains '/services' %} current {% elsif page.url contains '/service' %} current {%endif %}">{{
                site.menu['services'][current_lang]
                }}</a></li>
        <li><a href="{{ site.baseurl }}{{ site.t['about'][current_lang] }}"
                class="{% if page.url contains '/about' %} current {% elsif page.url contains '/wir' %} current {%endif %}">{{
                site.menu['about'][current_lang] }}</a></li>
        {% if include.navclass == "nav-footer" -%}
        <li><a href="{{ site.baseurl }}{{ site.t['imprint'][current_lang] }}"
                class="{% if page.url contains '/imprint' %}current {%endif %}">{{ site.menu['imprint'][current_lang] }}</a></li>
        {%- endif -%}
    </ul>
</nav>
