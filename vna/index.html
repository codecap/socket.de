<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      const lang = navigator.language?.startsWith('de') ? 'de' : 'en';
      window.location.replace('/' + lang + '/vna/');
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/en/vna/">
  </noscript>
</head>
<body>
</body>
</html>
